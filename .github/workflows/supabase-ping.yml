name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows triggering manually from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          KEY="${SUPABASE_KEY:-sb_publishable_u8vwBptSVGNNSpqbGUFepA_cHovl1ns}"
          curl -s -X GET "https://jzkvlgvnhlgvmumgqxpq.supabase.co/rest/v1/services?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
